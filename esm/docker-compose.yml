services:
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      NODE_ENV: development
      ADMIN_API_KEY: 12345

      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: inventory_db

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: admin
      MYSQL_DATABASE: inventory_db

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: abcdefghijklmnopqrstuvwxyz123456

    depends_on:
      - mysql
      - redis
      - mongo

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: inventory_db
    ports:
      - "3307:3306"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"